spring:
  application:
    name: wealthmaster
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wealthmaster}
    username: ${DB_USER:${POSTGRES_USER:wealthmaster}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change-me-in-production}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  initial-owner:
    email: ${INITIAL_OWNER_EMAIL:}
    password: ${INITIAL_OWNER_PASSWORD:}

  mfa:
    encryption-password: ${MFA_ENCRYPTION_PASSWORD:}
    encryption-salt: ${MFA_ENCRYPTION_SALT:}
