# Included in http{} by nginx; applies only to the standalone demo deployment.
map $request_method $demo_write_key {
    default "";
    POST shared-demo;
    PUT shared-demo;
    DELETE shared-demo;
    PATCH shared-demo;
}
limit_req_zone $server_name zone=demo_all:1m rate=30r/s;
limit_req_zone $demo_write_key zone=demo_write:1m rate=5r/s;
limit_req_zone $server_name zone=demo_entry:1m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    limit_req_status 429;
    error_page 429 = @demo_rate;
    error_page 502 503 504 = @demo_maintenance;

    location ~ ^/api/v1/auth/(csrf|demo/session)$ {
        limit_req zone=demo_all burst=60 nodelay;
        limit_req zone=demo_write burst=10 nodelay;
        limit_req zone=demo_entry burst=20 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /api/ {
        limit_req zone=demo_all burst=60 nodelay;
        limit_req zone=demo_write burst=10 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
    }
    location @demo_rate {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control no-store always;
        return 429 '{"message":"The shared demo is busy. Please retry in a minute.","retryAfterSeconds":60}';
    }
    location @demo_maintenance {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control no-store always;
        return 503 '{"message":"The shared demo is being restored. Please retry shortly.","retryAfterSeconds":30}';
    }
    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health/readiness;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
