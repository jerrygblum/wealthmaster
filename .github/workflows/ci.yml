name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Require Docker for database integration tests
        run: docker info
      - name: Test backend
        run: mvn --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Verify tooling rules
        run: npm run test:tooling
      - name: Typecheck/build
        run: npm run build
      - name: Test
        run: npm test

  browser:
    strategy:
      matrix:
        profile: [dev, prod]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: wealthmaster_e2e
          POSTGRES_USER: wealthmaster_test
          POSTGRES_PASSWORD: synthetic-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthmaster_test -d wealthmaster_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_PROFILE: ${{ matrix.profile }}
      DB_URL: jdbc:postgresql://localhost:5432/wealthmaster_e2e
      DB_USER: wealthmaster_test
      DB_PASSWORD: synthetic-db-password
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.profile }}
          path: frontend/test-results/

  deployment:
    name: Validate production Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate NAS update script
        run: |
          sh -n scripts/deploy-nas.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validate with synthetic configuration
        env:
          WEALTHMASTER_IMAGE_TAG: sha-validation
          POSTGRES_PASSWORD: synthetic-validation-password
          MFA_ENCRYPTION_PASSWORD: synthetic-validation-key-not-for-production
          MFA_ENCRYPTION_SALT: 0123456789abcdef0123456789abcdef
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

  publish:
    name: Publish ${{ matrix.service }} image
    needs: [backend, frontend, browser, deployment]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Choose image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          # Keep a single-platform image manifest for the NAS's older Docker engine.
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record deployment version
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          echo "Published: ${IMAGE}:sha-${REVISION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Set WEALTHMASTER_IMAGE_TAG=sha-${REVISION} on the NAS after both images publish successfully." >> "$GITHUB_STEP_SUMMARY"
